<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>registration</title>

    <link rel="preconnect" href="https://fonts.googleapis.com/" />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style type="text/tailwindcss">
      @theme {
        --color-primary: #586158;
        --color-secondary: #f9f6f0;
        --color-tertiary: #f3f3f0;
        --color-neutral: #4a4a4a;
        --color-background: #fbf9f8;
        --font-display: "Literata", serif;
        --font-body: "Plus Jakarta Sans", sans-serif;
      }
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .font-display {
        font-family: "Literata", serif;
      }
    </style>

  <body class="min-h-screen flex flex-col bg-tertiary items-center px-4 py-4">
    <div class="card w-full flex flex-col bg-background my-4 p-6 rounded-xl md:w-1/3 shadow-md">
      <!-- Head content -->
      <div
        class="flex flex-col justify-center items-center font-[family-name:Literata] gap-2 p-4"
      >
        <img class="w-8" src="mali_shopblog\flower_icon.svg" alt="Shop icon" />
        <h1 class="text-2xl font-bold">Atelier de Flora</h1>
        <p class="text-gray-400 text-sm">Create Your Account</p>
      </div>
      <!-- main content -->
      <div class="flex flex-col font-[family-name:Plus_Jakarta_Sans] gap-6">
        <div class="flex flex-col gap-2">
          <label>First Name</label>
          <input
            class="w-full bg-tertiary border-1 border-gray-300 rounded-md p-3"
            placeholder="e.g.Flora"
          />
        </div>
        <div class="flex flex-col gap-2">
          <label>Last Name</label>
          <input
            class="w-full bg-tertiary border-1 border-gray-300 rounded-md p-3"
            placeholder="e.g.Bloom"
          />
        </div>
        <div class="flex flex-col gap-2">
          <label>Email Address</label>
          <input
            class="w-full bg-tertiary border-1 border-gray-300 rounded-md p-3"
            placeholder="e.g.hello@example.com"
          />
        </div>
        <div class="flex flex-col gap-2">
          <label>Password</label>
          <div
            class="w-full flex flex-row justify-between bg-tertiary border-1 border-gray-300 rounded-md p-3"
          >
            <input placeholder="••••••••" />
            <img
              src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiIGNsYXNzPSJsdWNpZGUgbHVjaWRlLWV5ZS1vZmYtaWNvbiBsdWNpZGUtZXllLW9mZiI+PHBhdGggZD0iTTEwLjczMyA1LjA3NmExMC43NDQgMTAuNzQ0IDAgMCAxIDExLjIwNSA2LjU3NSAxIDEgMCAwIDEgMCAuNjk2IDEwLjc0NyAxMC43NDcgMCAwIDEtMS40NDQgMi40OSIvPjxwYXRoIGQ9Ik0xNC4wODQgMTQuMTU4YTMgMyAwIDAgMS00LjI0Mi00LjI0MiIvPjxwYXRoIGQ9Ik0xNy40NzkgMTcuNDk5YTEwLjc1IDEwLjc1IDAgMCAxLTE1LjQxNy01LjE1MSAxIDEgMCAwIDEgMC0uNjk2IDEwLjc1IDEwLjc1IDAgMCAxIDQuNDQ2LTUuMTQzIi8+PHBhdGggZD0ibTIgMiAyMCAyMCIvPjwvc3ZnPg=="
            />
          </div>
        </div>
        <div class="flex flex-col gap-2">
          <label>Confirm Password</label>
          <input
            class="w-full bg-tertiary border-1 border-gray-300 rounded-md p-3"
            placeholder="••••••••"
          />
        </div>
        <div class="flex flex-col mt-4">
          <button class="bg-olive-600 text-white rounded-md p-3">
            Create Account
          </button>
        </div>
        <div class="flex flex-col gap-2 text-center mt-6">
          <p class="">
            Already have an account?
            <a href="" class="text-blue-500">Sign In</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
