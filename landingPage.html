<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=Playball&family=Playwrite+US+Trad:wght@100..400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="min-h-screen w-full flex pl-4 pr-4 pt-12 pb-12 md:pt-24 pb-24">
      <div
        class="flex-1 flex flex-col items-start justify-center bg-slate-300 p-4 rounded-2xl shadow-xl"
      >
        <div class="bg-slate-200 opacity-50% rounded-2xl p-4">
          <h1 class="font-[family-name:Literata] text-5xl text-shadow-lg">Atelier de Flora</h1>
          <p class="font-[family-name:Playball] text-base pt-4 pb-4  text-shadow-lg">
            From intimate moments to grand celebrations, we craft custom floral
            arrangements tailored precisely to your vision. Every bloom is
            meticulously sourced, expertly cared for, and delivered
            fresh—guaranteed to look as breathtaking in hand as it does in your
            imagination.
          </p>
          <button
            class="font-[family-name:Playwrite_US_Trad] p-2 bg-amber-100 rounded-full"
          >
            Explore Collection ⟶
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
