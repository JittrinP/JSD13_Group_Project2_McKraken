<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Atelier de Flora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap');
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#586158',
                        secondary: '#F9F6F0',
                        tertiary: '#F3F3F0',
                        neutral: '#4A4A4A',
                    },
                    fontFamily: {
                        serif: ['"Literata"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-secondary font-sans text-neutral min-h-screen flex sm:items-center justify-center pt-8 sm:pt-0 p-4 antialiased">

    <!-- Card: Change Password -->
    <div class="bg-white rounded-[2rem] w-full max-w-[420px] my-auto sm:my-0 flex flex-col justify-center px-8 py-10 border border-black/5 shadow-[0_8px_30px_rgb(0,0,0,0.04)]">
        
        <!-- Logo -->
        <div class="flex justify-center mb-3">
            <svg width="36" height="42" viewBox="0 0 36 42" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Leaves -->
                <path d="M17.5 41C17.5 41 0 35 0 21C11 21 17.5 31 17.5 41Z" fill="#586158"/>
                <path d="M18.5 41C18.5 41 36 35 36 21C25 21 18.5 31 18.5 41Z" fill="#586158"/>
                
                <!-- Flower Base -->
                <g mask="url(#hole)">
                    <circle cx="18" cy="14" r="8" fill="#586158"/>
                    <circle cx="18" cy="5" r="5" fill="#586158"/>
                    <circle cx="25.5" cy="9" r="5" fill="#586158"/>
                    <circle cx="25.5" cy="18" r="5" fill="#586158"/>
                    <circle cx="18" cy="22" r="5" fill="#586158"/>
                    <circle cx="10.5" cy="18" r="5" fill="#586158"/>
                    <circle cx="10.5" cy="9" r="5" fill="#586158"/>
                </g>
                
                <!-- Mask for hole -->
                <defs>
                    <mask id="hole">
                        <rect width="36" height="42" fill="white"/>
                        <circle cx="18" cy="14" r="4.5" fill="black"/>
                    </mask>
                </defs>
            </svg>
        </div>

        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="font-serif text-3xl text-primary font-bold tracking-tight mb-2">Atelier de Flora</h1>
            <p class="text-[13px] text-neutral/80">Welcome to</p>
        </div>

        <!-- Form -->
        <form class="space-y-5">
            <!-- Old Password Field -->
            <div>
                <label class="block text-[13px] font-medium text-neutral mb-2">Old Password</label>
                <input type="text" placeholder="jane.doe@example.com" 
                    class="w-full bg-tertiary/70 border border-gray-200 text-neutral rounded-lg px-4 py-3 text-[14px] focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-neutral/40">
            </div>

            <!-- New Password Field -->
            <div>
                <label class="block text-[13px] font-medium text-neutral mb-2">New Password</label>
                <input type="password" placeholder="••••••••" 
                    class="w-full bg-tertiary/70 border border-gray-200 text-neutral rounded-lg px-4 py-3 text-[18px] tracking-[0.2em] focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-neutral/40 placeholder:tracking-[0.2em] h-[48px]">
            </div>

            <!-- Re-New Password Field -->
            <div>
                <label class="block text-[13px] font-medium text-neutral mb-2">Re-New Password</label>
                <input type="password" placeholder="••••••••" 
                    class="w-full bg-tertiary/70 border border-gray-200 text-neutral rounded-lg px-4 py-3 text-[18px] tracking-[0.2em] focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-neutral/40 placeholder:tracking-[0.2em] h-[48px]">
            </div>

            <!-- Change Password Button -->
            <button type="submit" 
                class="w-full bg-primary text-white rounded-lg px-4 py-3.5 text-[14px] font-medium hover:bg-primary/90 transition-all flex justify-center items-center gap-2 !mt-8 shadow-sm">
                Change Password &rarr;
            </button>
        </form>

    </div>

</body>
</html>
